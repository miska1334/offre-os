# ── NETLIFY.TOML ──────────────────────────────
# Déploiement du prototype OffreOS

[build]
  # Dossier racine du site (HTML/CSS/JS)
  publish = "."
  # Dossier des fonctions serverless
  functions = "netlify/functions"

[functions]
  timeout = 26

# Redirects pour les pages légales
[[redirects]]
  from = "/confidentialite"
  to   = "/confidentialite.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to   = "/mentions-legales.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Headers pour les fonctions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Variables d'environnement (à définir dans le dashboard Netlify)
# NE JAMAIS mettre la clé API ici — toujours dans le dashboard Netlify
# Variables requises :
#   CLAUDE_API_KEY = sk-ant-...
